# Builds the Linux AppImage, the Flatpak (x86_64 + aarch64) and the macOS .dmg,
# and publishes them on a GitHub Release whenever a version tag is pushed. A
# non-prerelease tag also redeploys the self-hosted Flatpak repo on GitHub
# Pages (GitHub #13), which is where installed Flatpaks get their updates.
#
# Why a Release (not just a tag): the app's startup update check reads
# `api.github.com/repos/nielsfranke/Cullimingo/releases/latest`, and that
# endpoint only returns *published Releases*. Pushing a tag doesn't create one,
# so this workflow turns each `v*` tag into a Release with downloadable
# artifacts.
#
# Tag convention: `v<pubspec version>` (e.g. `v1.0.0`). Pre-release tags carry a
# suffix (`v1.1.0-rc.1`) and are flagged as pre-releases so `/releases/latest`
# skips them.
#
# `workflow_dispatch` builds all artifacts and leaves them as run artifacts
# (no Release, no Pages deploy) so the build pipeline can be exercised without
# cutting a tag.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  build-linux:
    runs-on: ubuntu-24.04 # oldest glibc we support; AppImage is forward-compatible only
    steps:
      - uses: actions/checkout@v7

      - name: Install build + native deps
        run: |
          sudo apt-get update
          # Flutter Linux desktop toolchain + the native libs bundle_linux.sh
          # copies in (libvips/libraw + libheif plugins: the AVIF encoder and
          # the HEVC decoder for HEIC/HIF, #10) + patchelf.
          # libsecret-1-dev + libjsoncpp-dev are build-time deps of the
          # flutter_secure_storage_linux plugin (its CMake pkg_check_modules).
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            patchelf libvips-dev libraw-dev libheif-dev libheif-plugin-aomenc \
            libheif-plugin-libde265 \
            libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build AppImage
        run: |
          flutter pub get
          flutter build linux --release
          tool/bundle_linux.sh
          tool/build_appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            build/linux/Cullimingo-x86_64.AppImage
            build/linux/Cullimingo-x86_64.AppImage.zsync
          if-no-files-found: error

  build-macos:
    runs-on: macos-14 # Apple Silicon (arm64) — matches the bundled arm64 dylibs
    steps:
      - uses: actions/checkout@v7

      - name: Install native deps
        run: brew install vips libraw dylibbundler

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build .dmg
        run: |
          flutter pub get
          flutter build macos --release
          tool/bundle_macos.sh
          tool/build_dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: build/macos/Cullimingo-arm64.dmg
          if-no-files-found: error

  build-flatpak:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # GNOME 51 runtime + SDK preinstalled; flatpak-builder needs --privileged
    # for its build sandbox.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Import the repo signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "FLATPAK_GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY=$key" >> "$GITHUB_ENV"

      - name: Build the Flatpak from source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tool/build_flatpak.sh "$GITHUB_SHA" build/flatpak
          # Artifacts drop permissions; ship the OSTree repo as a tarball.
          tar -C build/flatpak -cf build/flatpak/repo-${{ matrix.arch }}.tar repo

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: build/flatpak/Cullimingo-${{ matrix.arch }}.flatpak
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: build/flatpak/repo-${{ matrix.arch }}.tar
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/') # only tag pushes publish a Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload needs to write Releases
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7 # for CHANGELOG.md

      # Everything but the Flatpak repo tarballs (those go to Pages) lands
      # flat in dist/.
      - uses: actions/download-artifact@v8
        with:
          pattern: '{appimage,dmg,flatpak-bundle-*}'
          path: dist
          merge-multiple: true

      - name: Publish the Release with artifacts
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Pull this version's section out of CHANGELOG.md (between its
          # "## <version>" heading and the next "## " heading). This is the
          # curated fixes/features list; --generate-notes only lists merged PRs,
          # which this repo rarely has, so it produced empty notes.
          changelog="$(awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { grab = 1; next }
            /^## / && grab { exit }
            grab { print }
          ' CHANGELOG.md)"
          if [ -z "$changelog" ]; then
            changelog="See the [full changelog](https://github.com/${GH_REPO}/blob/main/CHANGELOG.md)."
          fi

          # Install instructions shown below the changes.
          cat > install.md <<'EOF'
          ## Install

          ### Linux (AppImage)
          Download `Cullimingo-x86_64.AppImage`, make it executable, and run it:
          ```
          chmod +x Cullimingo-x86_64.AppImage
          ./Cullimingo-x86_64.AppImage
          ```
          To update in place, use AppImageUpdate or Gear Lever — only the
          changed parts are downloaded.

          ### Linux (Flatpak)
          Install from Cullimingo's own Flatpak repository; updates then come
          through `flatpak update` or your software centre:
          ```
          flatpak install --user https://nielsfranke.github.io/Cullimingo/io.github.nielsfranke.Cullimingo.flatpakref
          ```
          Or download `Cullimingo-x86_64.flatpak` (or `-aarch64`) and run
          `flatpak install --user Cullimingo-x86_64.flatpak`. It subscribes to
          the same repository for updates.

          ### macOS (Apple Silicon)
          1. Open `Cullimingo-arm64.dmg` and drag **Cullimingo** to **Applications**.
          2. The app isn't signed/notarized, so clear the quarantine flag once —
             open **Terminal** and run:
             ```
             xattr -cr /Applications/Cullimingo.app
             ```
          3. Launch it from Applications.
          EOF

          # Notes = what changed (from CHANGELOG) + install instructions.
          {
            printf "## What's changed\n\n"
            printf '%s\n\n' "$changelog"
            cat install.md
          } > notes.md

          # A hyphen in the tag (v1.1.0-rc.1) marks a pre-release.
          prerelease_flag=""
          case "$TAG" in
            *-*) prerelease_flag="--prerelease" ;;
          esac

          # Idempotent: create the Release if absent, else refresh its artifacts
          # and notes (so a re-run after editing the changelog updates them).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" \
              --title "Cullimingo ${TAG#v}" \
              --notes-file notes.md \
              --verify-tag \
              $prerelease_flag \
              dist/*
          fi

  # Rebuilds the self-hosted Flatpak repo from this release's two arch repos,
  # signs it, and deploys it to GitHub Pages (tool/publish_flatpak_repo.sh).
  # Skipped for pre-releases, so installed Flatpaks only see stable versions.
  publish-flatpak:
    needs: [build-flatpak, release]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    permissions:
      contents: read
      pages: write # deploy-pages
      id-token: write # deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-repo-*
          path: repos
          merge-multiple: true

      - name: Import the repo signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "FLATPAK_GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY=$key" >> "$GITHUB_ENV"

      - name: Assemble the signed repo site
        run: |
          set -euo pipefail
          for t in repos/repo-*.tar; do
            arch=$(basename "$t" .tar); arch=${arch#repo-}
            mkdir -p "repos/$arch" && tar -C "repos/$arch" -xf "$t"
          done
          tool/publish_flatpak_repo.sh site repos/*/repo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
