# Format, analyze, test (Linux + macOS) and a release build per platform on
# every push to main and every pull request. Release artifacts are built and
# published separately by release.yml on a `v*` tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze

  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libraw-dev libheif-dev \
            libheif-plugin-aomenc libheif-plugin-libde265
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests with coverage
        run: flutter test --coverage

  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install native deps
        run: brew install vips libraw
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run tests
        run: flutter test

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          # Same set as release.yml; libsecret/jsoncpp are build-time deps of
          # the flutter_secure_storage_linux plugin.
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libvips-dev libraw-dev libheif-dev \
            libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux bundle
        run: flutter build linux --release

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install native deps
        run: brew install vips libraw
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS bundle
        run: flutter build macos --release
